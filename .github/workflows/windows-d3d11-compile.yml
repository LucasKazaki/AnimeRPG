name: Windows D3D11 compile and CPU shader diagnostics

on:
  workflow_dispatch:
  push:
    branches:
      - "main"
    paths:
      - "CMakeLists.txt"
      - "cmake/**"
      - "Engine/**"
      - "Tests/**"
      - ".github/workflows/windows-d3d11-compile.yml"
  pull_request:
    paths:
      - "CMakeLists.txt"
      - "cmake/**"
      - "Engine/**"
      - "Tests/**"
      - ".github/workflows/windows-d3d11-compile.yml"

permissions:
  contents: read

concurrency:
  group: windows-d3d11-compile-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  compile-and-shader-diagnostics:
    name: D3D11 compile + CPU shaders Debug/Release (${{ matrix.revision }})
    runs-on: windows-2022
    timeout-minutes: 30
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        revision: ${{ fromJSON(github.event_name == 'pull_request' && '["head","merge"]' || '["commit"]') }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event_name == 'pull_request' && matrix.revision == 'head' && github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 2

      - name: Verify exact revision and pull request merge parents
        shell: pwsh
        env:
          CI_REVISION: ${{ matrix.revision }}
          CI_EVENT_NAME: ${{ github.event_name }}
          CI_EVENT_SHA: ${{ github.sha }}
          CI_PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          CI_PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          $ErrorActionPreference = "Stop"
          $isPullRequest = $env:CI_EVENT_NAME -eq "pull_request"
          if (($isPullRequest -and $env:CI_REVISION -notin @("head", "merge")) -or
              (-not $isPullRequest -and $env:CI_REVISION -ne "commit")) {
            throw "Unexpected revision leg $env:CI_REVISION for $env:CI_EVENT_NAME."
          }
          $expected = if ($isPullRequest -and $env:CI_REVISION -eq "head") {
            $env:CI_PR_HEAD_SHA
          } else {
            $env:CI_EVENT_SHA
          }
          $identities = @($expected, $env:CI_EVENT_SHA)
          if ($isPullRequest) { $identities += @($env:CI_PR_BASE_SHA, $env:CI_PR_HEAD_SHA) }
          foreach ($identity in $identities) {
            if ($identity -notmatch '^[0-9a-fA-F]{40}$') { throw "Missing or invalid event commit identity." }
          }
          $actual = git rev-parse --verify HEAD
          if ($LASTEXITCODE -ne 0) { throw "Cannot resolve checked-out HEAD." }
          $actual = $actual.Trim()
          if ($actual -ne $expected) {
            throw "Expected exact $env:CI_REVISION checkout $expected, got $actual."
          }
          $parentText = git show -s --format=%P HEAD
          if ($LASTEXITCODE -ne 0) { throw "Cannot inspect checked-out commit parents." }
          $parents = @(([string]$parentText).Trim() -split '\s+' | Where-Object { $_ })
          if ($isPullRequest -and $env:CI_REVISION -eq "merge") {
            if ($parents.Count -ne 2 -or $parents[0] -ne $env:CI_PR_BASE_SHA -or
                $parents[1] -ne $env:CI_PR_HEAD_SHA) {
              throw "Merge parents do not match event base/head: $($parents -join ' ')."
            }
          }
          $receipt = @(
            "- revision: $env:CI_REVISION"
            "- event: $env:CI_EVENT_NAME"
            "- event_sha: $env:CI_EVENT_SHA"
            "- checkout_sha: $actual"
            "- event_base_sha: $env:CI_PR_BASE_SHA"
            "- event_head_sha: $env:CI_PR_HEAD_SHA"
            "- parents: $($parents -join ' ')"
          )
          $receipt | ForEach-Object { Write-Host $_ }
          "### Checkout provenance ($env:CI_REVISION)" | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Encoding utf8 -Append
          $receipt | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Encoding utf8 -Append

      - name: Set external compile build root
        shell: pwsh
        run: |
          "BUILD_ROOT=$env:RUNNER_TEMP/AstralD3D11-compile" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "Compile and CPU shader diagnostics only. Hardware rendering, image comparison and performance acceptance remain pending local validation." | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Encoding utf8 -Append

      # Enabling the test target does not execute it. Do not use CTest or call
      # this executable without the CPU-only filter below on hosted runners.
      - name: Configure optional D3D11 target for compilation
        shell: pwsh
        run: cmake -S . -B "$env:BUILD_ROOT" -G "Visual Studio 17 2022" -A x64 -DBUILD_TESTING=ON -DASTRAL_BUILD_D3D11=ON -DASTRAL_ENABLE_HARDWARE_GPU_TESTS=ON

      - name: Compile D3D11 test target Debug (two jobs)
        shell: pwsh
        run: cmake --build "$env:BUILD_ROOT" --config Debug --target EngineD3D11Tests --parallel 2

      - name: Run CPU shader diagnostics only Debug (no device)
        shell: pwsh
        run: |
          & "$env:BUILD_ROOT/Debug/EngineD3D11Tests.exe" ShaderCompilerReturnsRealDiagnosticsAndRecovers
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Compile D3D11 test target Release (two jobs)
        shell: pwsh
        run: cmake --build "$env:BUILD_ROOT" --config Release --target EngineD3D11Tests --parallel 2

      - name: Run CPU shader diagnostics only Release (no device)
        shell: pwsh
        run: |
          & "$env:BUILD_ROOT/Release/EngineD3D11Tests.exe" ShaderCompilerReturnsRealDiagnosticsAndRecovers
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Confirm clean tracked tree
        shell: pwsh
        run: |
          git diff --check
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $changes = git status --porcelain --untracked-files=no
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          if ($changes) { throw "Tracked files changed during compile/shader validation." }
