name: Consolidation source review snapshot
on:
  push:
    branches: ['audit/2026-09-22-pr-consolidation-review']
    paths: ['.github/workflows/consolidation-source-review.yml']
permissions:
  contents: read
jobs:
  snapshot:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Export exact reviewed revisions without running project code
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/consolidation-snapshots"
          for sha in 771b61ac116dfa4a70d81b53a390f672aaf3bf4e e12e6c559bf776ffc9c715c809a517f8e02ce5d5 64e35980781c875d6f62e798e3bfa17fdc093897 3a753b132418164d888a3202c856b75293c1580b 9d2e5fe9938bd9fa34c92c65053ca0e36f5d4ae3 7ed4348510702b705cbf4e621bba52569e7830b2; do
            test "$(git rev-parse "$sha^{commit}")" = "$sha"
            git archive --format=tar "$sha" | gzip -n > "$RUNNER_TEMP/consolidation-snapshots/$sha.tar.gz"
            git ls-tree -r -z "$sha" > "$RUNNER_TEMP/consolidation-snapshots/$sha.tree"
          done
          cd "$RUNNER_TEMP/consolidation-snapshots"
          sha256sum *.tar.gz *.tree > SHA256SUMS
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: consolidation-source-snapshots
          path: ${{ runner.temp }}/consolidation-snapshots/
          if-no-files-found: error
          retention-days: 3
