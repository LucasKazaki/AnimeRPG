name: Windows build and deterministic tests

on:
  workflow_dispatch:
  push:
    branches:
      - "main"
    paths:
      - "CMakeLists.txt"
      - "cmake/**"
      - "Engine/**"
      - "Game/**"
      - "Tests/**"
      - "Scripts/**"
      - ".github/workflows/windows-ci.yml"
  pull_request:
    paths:
      - "CMakeLists.txt"
      - "cmake/**"
      - "Engine/**"
      - "Game/**"
      - "Tests/**"
      - "Scripts/**"
      - ".github/workflows/windows-ci.yml"

permissions:
  contents: read

concurrency:
  group: windows-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    name: MSVC Debug and Release
    runs-on: windows-2022
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set external build root
        shell: pwsh
        run: |
          "BUILD_ROOT=$env:RUNNER_TEMP/AstralEngine-build" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Parse R0 recovery runner
        run: python -m py_compile Scripts/invoke_r0_release_candidate.py

      - name: Verify R0 runner safety contracts
        run: python Scripts/test_r0_runner_safety.py

      - name: Verify R0 Windows Job Object containment contract
        shell: pwsh
        run: |
          $probe = Join-Path $env:RUNNER_TEMP "r0-windows-job-object-probe.py"
          @'
          import argparse
          import ctypes
          import importlib.util
          import sys
          import tempfile
          from ctypes import wintypes
          from pathlib import Path

          script = Path("Scripts/invoke_r0_release_candidate.py").resolve()
          spec = importlib.util.spec_from_file_location("r0_runner_job_probe", script)
          if spec is None or spec.loader is None:
              raise RuntimeError("could not load the R0 runner for the Windows Job Object probe")
          r0 = importlib.util.module_from_spec(spec)
          sys.modules[spec.name] = r0
          spec.loader.exec_module(r0)

          probe_code = r'''
          import ctypes
          from ctypes import wintypes

          class IO_COUNTERS(ctypes.Structure):
              _fields_ = [
                  ("ReadOperationCount", ctypes.c_ulonglong),
                  ("WriteOperationCount", ctypes.c_ulonglong),
                  ("OtherOperationCount", ctypes.c_ulonglong),
                  ("ReadTransferCount", ctypes.c_ulonglong),
                  ("WriteTransferCount", ctypes.c_ulonglong),
                  ("OtherTransferCount", ctypes.c_ulonglong),
              ]

          class JOBOBJECT_BASIC_LIMIT_INFORMATION(ctypes.Structure):
              _fields_ = [
                  ("PerProcessUserTimeLimit", ctypes.c_longlong),
                  ("PerJobUserTimeLimit", ctypes.c_longlong),
                  ("LimitFlags", wintypes.DWORD),
                  ("MinimumWorkingSetSize", ctypes.c_size_t),
                  ("MaximumWorkingSetSize", ctypes.c_size_t),
                  ("ActiveProcessLimit", wintypes.DWORD),
                  ("Affinity", ctypes.c_size_t),
                  ("PriorityClass", wintypes.DWORD),
                  ("SchedulingClass", wintypes.DWORD),
              ]

          class JOBOBJECT_EXTENDED_LIMIT_INFORMATION(ctypes.Structure):
              _fields_ = [
                  ("BasicLimitInformation", JOBOBJECT_BASIC_LIMIT_INFORMATION),
                  ("IoInfo", IO_COUNTERS),
                  ("ProcessMemoryLimit", ctypes.c_size_t),
                  ("JobMemoryLimit", ctypes.c_size_t),
                  ("PeakProcessMemoryUsed", ctypes.c_size_t),
                  ("PeakJobMemoryUsed", ctypes.c_size_t),
              ]

          kernel32 = ctypes.WinDLL("kernel32", use_last_error=True)
          kernel32.GetCurrentProcess.argtypes = []
          kernel32.GetCurrentProcess.restype = wintypes.HANDLE
          kernel32.IsProcessInJob.argtypes = [wintypes.HANDLE, wintypes.HANDLE, ctypes.POINTER(wintypes.BOOL)]
          kernel32.IsProcessInJob.restype = wintypes.BOOL
          kernel32.QueryInformationJobObject.argtypes = [
              wintypes.HANDLE, ctypes.c_int, ctypes.c_void_p, wintypes.DWORD, ctypes.POINTER(wintypes.DWORD)
          ]
          kernel32.QueryInformationJobObject.restype = wintypes.BOOL
          kernel32.CreateJobObjectW.argtypes = [ctypes.c_void_p, wintypes.LPCWSTR]
          kernel32.CreateJobObjectW.restype = wintypes.HANDLE
          kernel32.AssignProcessToJobObject.argtypes = [wintypes.HANDLE, wintypes.HANDLE]
          kernel32.AssignProcessToJobObject.restype = wintypes.BOOL
          kernel32.CloseHandle.argtypes = [wintypes.HANDLE]
          kernel32.CloseHandle.restype = wintypes.BOOL

          current = kernel32.GetCurrentProcess()
          in_job = wintypes.BOOL()
          if not kernel32.IsProcessInJob(current, None, ctypes.byref(in_job)):
              raise ctypes.WinError(ctypes.get_last_error())
          if not in_job.value:
              raise RuntimeError("supervised command is not associated with any Windows Job Object")

          limits = JOBOBJECT_EXTENDED_LIMIT_INFORMATION()
          if not kernel32.QueryInformationJobObject(
              None, 9, ctypes.byref(limits), ctypes.sizeof(limits), None
          ):
              raise ctypes.WinError(ctypes.get_last_error())
          if not (limits.BasicLimitInformation.LimitFlags & 0x00002000):
              raise RuntimeError("immediate Job Object is missing JOB_OBJECT_LIMIT_KILL_ON_JOB_CLOSE")

          nested = kernel32.CreateJobObjectW(None, None)
          if not nested:
              raise ctypes.WinError(ctypes.get_last_error())
          try:
              if not kernel32.AssignProcessToJobObject(nested, current):
                  raise ctypes.WinError(ctypes.get_last_error())
              print("ASTRAL_WINDOWS_JOB_OBJECT_PROBE_OK", flush=True)
          finally:
              kernel32.CloseHandle(nested)
          '''

          with tempfile.TemporaryDirectory() as temp:
              root = Path(temp)
              source = root / "source"
              worktree = root / "worktree"
              source.mkdir()
              worktree.mkdir()
              args = argparse.Namespace(
                  source_repository=source,
                  worktree=worktree,
                  build_root=root / "build",
                  release_root=root / "release",
                  evidence_root=root / "evidence",
                  recovery_branch="probe/r0-job-object",
                  base_ref="HEAD",
                  skip_fetch=True,
                  command_timeout_seconds=10.0,
                  capture_timeout_seconds=10.0,
              )
              runner = r0.R0Runner(args)
              runner.run_command(
                  "windows-job-object-probe",
                  [sys.executable, "-c", probe_code],
                  cwd=worktree,
                  timeout_seconds=10.0,
              )
              log = (args.evidence_root / "01-windows-job-object-probe.log").read_text(encoding="utf-8")
              if "ASTRAL_WINDOWS_JOB_OBJECT_PROBE_OK" not in log:
                  raise RuntimeError("Job Object probe marker is missing from retained command evidence")
              if len(runner.records) != 1 or runner.records[0].exit_code != 0:
                  raise RuntimeError("Job Object probe did not retain a successful command record")
              if runner.records[0].timed_out or runner.records[0].interrupted or runner.records[0].spawn_error:
                  raise RuntimeError("Job Object probe retained an unexpected failure state")
              print("Hosted Windows Job Object containment contract passed.")
          '@ | Set-Content -Path $probe -Encoding utf8
          python $probe
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Verify PE dependency inspector contracts
        run: python Scripts/test_pe_dependencies.py

      - name: Verify Windows prerequisite plan contracts
        run: python Scripts/test_windows_prerequisite_plan.py

      - name: Verify Windows runtime environment probe contracts
        run: python Scripts/test_windows_runtime_environment.py

      - name: Verify Windows runtime compatibility audit contracts
        run: python Scripts/test_windows_runtime_compatibility.py

      - name: Verify Windows Redistributable bootstrap contracts
        run: python Scripts/test_windows_redist_bootstrap.py

      - name: Verify Release assertion and CTest safety contracts
        run: python Scripts/test_test_safety.py

      - name: Configure Visual Studio 2022 x64
        run: cmake -S . -B "$env:BUILD_ROOT" -G "Visual Studio 17 2022" -A x64

      - name: Record Visual C++ Build Tools version
        shell: pwsh
        run: |
          $vswhere = Join-Path ${env:ProgramFiles(x86)} "Microsoft Visual Studio\Installer\vswhere.exe"
          if (-not (Test-Path $vswhere)) {
            Write-Error "vswhere.exe is unavailable; cannot bind the package to an exact Visual Studio 2022 toolset."
            exit 1
          }
          $installation = (& $vswhere -latest -version "[17.0,18.0)" -products * -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath | Select-Object -First 1)
          if (-not $installation) {
            Write-Error "No Visual Studio 2022 C++ tool installation was discovered."
            exit 1
          }
          $versionFile = Join-Path $installation.Trim() "VC\Auxiliary\Build\Microsoft.VCToolsVersion.default.txt"
          if (-not (Test-Path $versionFile)) {
            Write-Error "Visual C++ default toolset version file is missing: $versionFile"
            exit 1
          }
          $vcToolsVersion = (Get-Content $versionFile -Raw).Trim()
          if ($vcToolsVersion -notmatch '^\d+\.\d+\.\d+(?:\.\d+)?$') {
            Write-Error "Unexpected Visual C++ toolset version: $vcToolsVersion"
            exit 1
          }
          Write-Host "Visual C++ Build Tools version: $vcToolsVersion"
          "VC_TOOLS_VERSION=$vcToolsVersion" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Build Debug
        run: cmake --build "$env:BUILD_ROOT" --config Debug --parallel

      - name: Run deterministic Debug tests
        run: ctest --test-dir "$env:BUILD_ROOT" -C Debug --output-on-failure -E "RuntimeSmoke" --no-tests=error

      - name: Build Release
        run: cmake --build "$env:BUILD_ROOT" --config Release --parallel

      - name: Inspect Release runtime dependencies
        run: python Scripts/inspect_pe_dependencies.py "$env:BUILD_ROOT/Release/AstralGame.exe" --json "$env:RUNNER_TEMP/AstralGame-runtime-dependencies.json" --fail-on-debug-runtime

      - name: Plan Release Windows prerequisites
        run: python Scripts/plan_windows_prerequisites.py "$env:RUNNER_TEMP/AstralGame-runtime-dependencies.json" --json "$env:RUNNER_TEMP/AstralGame-windows-prerequisites.json" --fail-on-debug-runtime

      - name: Verify current Release prerequisite policy
        shell: pwsh
        run: |
          $plan = Get-Content "$env:RUNNER_TEMP/AstralGame-windows-prerequisites.json" -Raw | ConvertFrom-Json
          if ($plan.vc_runtime.strategy -ne "central_vc_redist") {
            Write-Error "Current Release build no longer resolves to the reviewed central VC Redistributable policy."
            exit 1
          }
          if ($plan.vc_runtime.architecture -ne "x64") {
            Write-Error "Current Release prerequisite plan is not x64."
            exit 1
          }
          if ($plan.vc_runtime.installer_bundled -ne $false -or $plan.vc_runtime.installer_executed -ne $false) {
            Write-Error "Hosted CI must not claim that a redistributable installer was bundled or executed."
            exit 1
          }
          if ($plan.release_policy.clean_machine_compatibility_verified -ne $false) {
            Write-Error "Hosted import inspection cannot establish clean-machine compatibility."
            exit 1
          }

      - name: Probe hosted central VC runtime environment
        run: python Scripts/probe_windows_runtime_environment.py "$env:RUNNER_TEMP/AstralGame-runtime-dependencies.json" "$env:RUNNER_TEMP/AstralGame-windows-prerequisites.json" "$env:BUILD_ROOT/Release/AstralGame.exe" --json "$env:RUNNER_TEMP/AstralGame-windows-runtime-preflight.json" --fail-on-missing

      - name: Audit hosted runtime version compatibility
        run: python Scripts/audit_windows_runtime_compatibility.py "$env:RUNNER_TEMP/AstralGame-windows-runtime-preflight.json" --vc-tools-version "$env:VC_TOOLS_VERSION" --json "$env:RUNNER_TEMP/AstralGame-windows-runtime-compatibility.json" --fail-on-incompatible

      - name: Plan hosted central VC Redistributable bootstrap
        run: python Scripts/plan_windows_redist_bootstrap.py "$env:RUNNER_TEMP/AstralGame-windows-prerequisites.json" "$env:RUNNER_TEMP/AstralGame-windows-runtime-compatibility.json" --json "$env:RUNNER_TEMP/AstralGame-windows-redist-bootstrap.json"

      - name: Verify hosted runtime and bootstrap claim boundaries
        shell: pwsh
        run: |
          $probe = Get-Content "$env:RUNNER_TEMP/AstralGame-windows-runtime-preflight.json" -Raw | ConvertFrom-Json
          if ($probe.vc_runtime.strategy -ne "central_vc_redist" -or $probe.package.architecture -ne "x64") {
            Write-Error "Hosted runtime preflight is not the reviewed x64 central VC runtime policy."
            exit 1
          }
          if ($probe.acceptance.preflight_passed -ne $true -or $probe.vc_runtime.all_required_files_present -ne $true -or $probe.vc_runtime.all_present_files_versioned -ne $true) {
            Write-Error "Hosted runtime preflight did not inventory every required central VC runtime file."
            exit 1
          }
          if ($probe.vc_runtime.runtime_version_compatibility_verified -ne $false -or $probe.acceptance.package_launch_verified -ne $false -or $probe.acceptance.clean_machine_compatibility_verified -ne $false -or $probe.acceptance.independent_acceptance -ne $false) {
            Write-Error "The preflight layer must not pre-claim compatibility, package launch, clean-machine, or independent acceptance."
            exit 1
          }
          foreach ($file in $probe.vc_runtime.files) {
            if ($file.present -ne $true -or -not $file.sha256 -or -not $file.file_version -or $file.size_bytes -le 0) {
              Write-Error "Hosted runtime evidence is incomplete for $($file.name)."
              exit 1
            }
          }

          $audit = Get-Content "$env:RUNNER_TEMP/AstralGame-windows-runtime-compatibility.json" -Raw | ConvertFrom-Json
          $expectedToolsVersion = $env:VC_TOOLS_VERSION
          if (($expectedToolsVersion -split '\.').Count -eq 3) { $expectedToolsVersion += ".0" }
          if ($audit.build_toolchain.vc_tools_version -ne $expectedToolsVersion) {
            Write-Error "Runtime compatibility evidence is not bound to the recorded Visual C++ Build Tools version."
            exit 1
          }
          if ($audit.compatibility.runtime_file_version_floor_satisfied -ne $true -or $audit.compatibility.runtime_version_compatibility_verified -ne $true) {
            Write-Error "Observed central VC runtime file versions are older than the build toolset used for AstralGame."
            exit 1
          }
          if ($audit.compatibility.supported_redist_installation_verified -ne $false -or $audit.acceptance.package_launch_verified -ne $false -or $audit.acceptance.clean_machine_compatibility_verified -ne $false -or $audit.acceptance.independent_acceptance -ne $false) {
            Write-Error "Hosted runtime version evidence must not claim installer provenance, package launch, clean-machine, or independent acceptance."
            exit 1
          }

          $bootstrap = Get-Content "$env:RUNNER_TEMP/AstralGame-windows-redist-bootstrap.json" -Raw | ConvertFrom-Json
          if ($bootstrap.package_sha256 -ne $audit.package_sha256 -or $bootstrap.architecture -ne "x64" -or $bootstrap.bootstrap.strategy -ne "central_vc_redist") {
            Write-Error "Redistributable bootstrap decision is not bound to the reviewed x64 package evidence."
            exit 1
          }
          if ($bootstrap.bootstrap.action -notin @("skip_install", "install_latest_supported")) {
            Write-Error "Redistributable bootstrap decision has an unsupported action."
            exit 1
          }
          if ($bootstrap.bootstrap.installer_downloaded -ne $false -or $bootstrap.bootstrap.installer_executed -ne $false -or $bootstrap.bootstrap.installation_receipt_verified -ne $false) {
            Write-Error "Hosted CI must not download, execute, or claim an installer receipt."
            exit 1
          }
          if ($bootstrap.acceptance.bootstrap_decision_verified -ne $true -or $bootstrap.acceptance.supported_redist_installation_verified -ne $false -or $bootstrap.acceptance.package_launch_verified -ne $false -or $bootstrap.acceptance.clean_machine_compatibility_verified -ne $false -or $bootstrap.acceptance.independent_acceptance -ne $false) {
            Write-Error "Bootstrap planning must retain installer, launch, clean-machine, and independent acceptance gates."
            exit 1
          }
          if ($bootstrap.bootstrap.action -eq "skip_install") {
            if ($null -eq $bootstrap.registered_v14_redist -or $bootstrap.registered_v14_redist.version_floor_satisfied -ne $true) {
              Write-Error "skip_install requires same-or-newer registered v14 Redistributable evidence."
              exit 1
            }
          }

      - name: Run deterministic Release tests
        run: ctest --test-dir "$env:BUILD_ROOT" -C Release --output-on-failure -E "RuntimeSmoke" --no-tests=error

      - name: Run static milestone verifiers
        shell: pwsh
        run: |
          foreach ($script in @("Scripts/verify_milestone1.py", "Scripts/verify_milestone2.py", "Scripts/verify_milestone3.py")) {
            python $script
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }

      - name: Confirm clean tracked tree
        shell: pwsh
        run: |
          git diff --check
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $changes = git status --porcelain --untracked-files=no
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          if ($changes) {
            Write-Error "Tracked files changed during CI."
            exit 1
          }

# RuntimeSmoke executables are compiled, but hosted CI is not interactive proof.
# Use one local interactive Windows desktop for their execution. RUN_SERIAL
# prevents overlap only within a single CTest invocation, not across processes.
